name: Build & Release CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright system dependencies
        run: npx playwright install --with-deps chromium

      - name: Generate PDFs
        run: npm run export

      - name: Verify outputs
        run: ls -la export/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume
          files: |
            export/CV-Aurelien-Leloup-EN.pdf
            export/CV-Aurelien-Leloup-FR.pdf
          make_latest: true
